name: Bug report
description: Report a reproducible problem with Pomofloat
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include steps to reproduce and the expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pomofloat version
      placeholder: 2.1.4
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include distribution, desktop environment, display server, and install method.
    validations:
      required: true
