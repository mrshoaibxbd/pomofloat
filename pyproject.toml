[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pomofloat"
version = "2.1.4"
description = "A lightweight always-on-top Pomodoro timer"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[tool.setuptools]
packages = ["pomofloat"]

[project.scripts]
pomofloat = "pomofloat.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
